/* =====================================
   Firebase設定
===================================== */

const ADMIN_UID = "Cvx67XLdEBMMUb9MSfpcDkUqfZD2";

const firebaseConfig = {
    apiKey:"AIzaSyDxVOTA6qpXn4_mPWyiqvINgjb1_k2Jeh8",
    authDomain:"work-stamp-app.firebaseapp.com",
    projectId:"work-stamp-app",
    storageBucket:"work-stamp-app.firebasestorage.app",
    messagingSenderId:"978728365973",
    appId:"1:978728365973:web:10c006305a417551061972"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

/* =====================================
   PINハッシュ
===================================== */

async function hashPin(pin){
    if(!pin)return "";
    const cleanPin=String(pin).trim();
    const msgUint8=new TextEncoder().encode(cleanPin);
    const hashBuffer=await crypto.subtle.digest("SHA-256",msgUint8);
    return Array.from(new Uint8Array(hashBuffer))
        .map(b=>b.toString(16).padStart(2,"0"))
        .join("");
}

/* =====================================
   アプリデータ
===================================== */

let appUnlockPinHash="03ac674216f3e15c761ee1a5e255f067953623c8b388b4459e13f978d7c846f4";
let notificationEmail="";
let staffMembers=[];
let siteMembers=["現場A","現場B"];
let appTitle="出退勤表(仮)";
let records=[];

/* =====================================
   管理者判定
===================================== */

function isAdminUser(){
    return !!auth.currentUser && auth.currentUser.uid===ADMIN_UID;
}

async function requireAdmin(){
    if(isAdminUser())return true;
    alert("管理者としてログインしてください。");
    return false;
}

/* =====================================
   Firestoreリアルタイム監視
===================================== */

let recordsUnsubscribe=null;
let recordsListenerGeneration=0;

function stopRecordsListener(){
    recordsListenerGeneration++;

    if(recordsUnsubscribe){
        try{
            recordsUnsubscribe();
        }catch(e){
            console.warn("古いFirestore監視の解除時エラー:",e);
        }
        recordsUnsubscribe=null;
    }
}

function startRecordsListener(){
    stopRecordsListener();

    const generation=recordsListenerGeneration;
    const syncStatus=document.getElementById("syncStatus");

    if(syncStatus)syncStatus.innerText="同期確認中…";

    if(!auth.currentUser){
        if(syncStatus)syncStatus.innerText="⚠️ 認証待ち";
        return;
    }

    const currentUid=auth.currentUser.uid;
    console.log("Firestore監視開始:",currentUid);

    const unsubscribe=onSnapshot(
        collection(db,"records"),
        snapshot=>{
            if(generation!==recordsListenerGeneration)return;

            console.log(
                "Firestoreリアルタイム更新:",
                snapshot.docChanges().length,
                "件 / UID:",
                currentUid
            );

            records=[];

            snapshot.forEach(docSnap=>{
                records.push({
                    id:docSnap.id,
                    ...docSnap.data()
                });
            });

            if(syncStatus)syncStatus.innerText="🟢 リアルタイム同期中";
            renderTable();
        },
        error=>{
            if(generation!==recordsListenerGeneration){
                console.warn("古いFirestore監視のエラーを無視:",error);
                return;
            }

            console.error(
                "Firestoreリアルタイム同期エラー:",
                error.code,
                error.message,
                error
            );

            if(syncStatus)syncStatus.innerText="⚠️ 同期エラー";
            recordsUnsubscribe=null;
        }
    );

    recordsUnsubscribe=unsubscribe;
}

/* =====================================
   認証初期化
===================================== */

async function initAuth(){
    try{
        const existingUser=await new Promise(resolve=>{
            const unsubscribe=onAuthStateChanged(auth,user=>{
                unsubscribe();
                resolve(user);
            });
        });

        if(existingUser && existingUser.uid===ADMIN_UID){
            await signOut(auth);
            const result=await signInAnonymously(auth);
            console.log("管理者セッションを解除して匿名認証:",result.user.uid);
            return true;
        }

        if(existingUser){
            console.log("既存の認証状態を確認:",existingUser.uid);
            return true;
        }

        const result=await signInAnonymously(auth);
        console.log("匿名認証OK:",result.user.uid);
        return true;

    }catch(error){
        console.error("認証失敗:",error);
        alert(
            "通信認証に失敗しました。\n\n"+
            "エラーコード: "+error.code+"\n"+
            "内容: "+error.message
        );
        return false;
    }
}

/* =====================================
   ページ起動
===================================== */

window.onload=async function(){
    const unlockBtn=document.getElementById("btnUnlockApp");
    const unlockInput=document.getElementById("inputUnlockPin");

    if(unlockBtn)unlockBtn.onclick=verifyAppUnlock;

    if(unlockInput){
        unlockInput.onkeypress=e=>{
            if(e.key==="Enter")verifyAppUnlock();
        };
    }

    const authSuccess=await initAuth();
    if(!authSuccess)return;

    await initFirebaseData();

    startRecordsListener();

    document.getElementById("btnClockIn").onclick=()=>handleClock("in");
    document.getElementById("btnClockOut").onclick=()=>handleClock("out");

    document.getElementById("btnOpenAdmin").onclick=openAdminPage;
    document.getElementById("btnCloseAdmin").onclick=closeAdminPage;

    document.getElementById("btnUpdateTitle").onclick=updateTitle;
    document.getElementById("btnUpdateEmail").onclick=updateEmail;
    document.getElementById("btnUpdateAppUnlockPin").onclick=updateAppUnlockPin;
    document.getElementById("btnResetSettings").onclick=resetSettingsToDefault;

    document.getElementById("btnExportCSV").onclick=exportToCSV;
    document.getElementById("btnClearAllRecords").onclick=clearAllRecords;

    document.getElementById("btnAddStaff").onclick=addStaff;
    document.getElementById("btnAddSite").onclick=addSite;
};

/* =====================================
   Firebaseデータ読み込み
===================================== */

async function initFirebaseData(){
    const defaultAppUnlockHash=
        "03ac674216f3e15c761ee1a5e255f067953623c8b388b4459e13f978d7c846f4";

    const defaultStaff=[
        {
            name:"山田 太郎",
            pinHash:"0ffe1abd1a08215353c233d6e009613e95eec4253832a761af28ff37ac5a150c"
        },
        {
            name:"佐藤 花子",
            pinHash:"edee29f882543b956620b26d0ee0e7e950399b1c4222f5de05e06425b4c995e9"
        }
    ];

    appUnlockPinHash=defaultAppUnlockHash;
    staffMembers=defaultStaff;
    siteMembers=["現場A","現場B"];
    appTitle="出退勤表(仮)";
    notificationEmail="";

    try{
        const settingsRef=doc(db,"settings","config");
        const settingsSnap=await getDoc(settingsRef);

        if(settingsSnap.exists()){
            const data=settingsSnap.data();

            appUnlockPinHash=data.appUnlockPinHash||defaultAppUnlockHash;
            appTitle=data.appTitle||"出退勤表(仮)";
            notificationEmail=data.notificationEmail||"";

            siteMembers=Array.isArray(data.siteMembers)
                ? data.siteMembers
                : ["現場A","現場B"];

            if(data.staffMembers && data.staffMembers.length>0){
                staffMembers=await Promise.all(
                    data.staffMembers.map(async staff=>{
                        let pHash=staff.pinHash;

                        if(!pHash && staff.pin){
                            pHash=await hashPin(staff.pin);
                        }

                        if(!pHash){
                            if(staff.name==="山田 太郎"){
                                pHash=await hashPin("1111");
                            }else if(staff.name==="佐藤 花子"){
                                pHash=await hashPin("2222");
                            }else{
                                pHash=await hashPin("0000");
                            }
                        }

                        return {
                            name:staff.name,
                            pinHash:pHash
                        };
                    })
                );
            }else{
                staffMembers=defaultStaff;
            }
        }else{
            appUnlockPinHash=defaultAppUnlockHash;
            staffMembers=defaultStaff;
            siteMembers=["現場A","現場B"];
            appTitle="出退勤表(仮)";
            notificationEmail="";
        }

        updateUI();

    }catch(error){
        console.error("Firebaseデータ読み込み失敗:",error);
        alert(
            "Firebaseのデータ読み込みに失敗しました。\n\n"+
            error.message
        );
    }
}

/* =====================================
   起動ロック解除
===================================== */

async function verifyAppUnlock(){
    const input=document.getElementById("inputUnlockPin");
    const errEl=document.getElementById("lockErrorMsg");

    const pin=input.value.trim();

    if(!pin){
        errEl.innerText="パスコードを入力するアル！";
        return;
    }

    const enteredHash=await hashPin(pin);

    if(enteredHash===appUnlockPinHash){
        document.getElementById("appLockScreen").style.display="none";
        input.value="";
        errEl.innerText="";
    }else{
        errEl.innerText="パスコードが違うアル！";
        input.value="";
    }
}

/* =====================================
   設定保存
===================================== */

async function saveSettingsToFirestore(){
    if(!isAdminUser()){
        alert(
            "管理者としてログインしていないため、設定を保存できません。"
        );
        return false;
    }

    try{
        const settingsRef=doc(db,"settings","config");

        await setDoc(settingsRef,{
            appUnlockPinHash,
            appTitle,
            notificationEmail,
            staffMembers,
            siteMembers
        });

        updateUI();
        return true;

    }catch(error){
        console.error("設定保存エラー:",error);
        alert(
            "設定の保存に失敗しました。\n\n"+
            error.message
        );
        return false;
    }
}

/* =====================================
   設定初期化
===================================== */

async function resetSettingsToDefault(){
    if(!await requireAdmin())return;

    if(!confirm(
        "設定を初期化するアル？\n"+
        "スタッフのPINや現場リストも初期状態に戻ります。"
    ))return;

    appUnlockPinHash=await hashPin("1234");

    staffMembers=[
        {name:"山田 太郎",pinHash:await hashPin("1111")},
        {name:"佐藤 花子",pinHash:await hashPin("2222")}
    ];

    siteMembers=["現場A","現場B"];
    appTitle="出退勤表(仮)";
    notificationEmail="";

    const saved=await saveSettingsToFirestore();

    if(saved)alert("設定を初期化したアル！");
}

/* =====================================
   UI更新
===================================== */

function updateUI(){
    const titleEl=document.getElementById("appTitleDisplay");

    if(titleEl){
        const textNode=Array.from(titleEl.childNodes)
            .find(node=>node.nodeType===Node.TEXT_NODE);

        if(textNode)textNode.nodeValue=appTitle+" ";
    }

    const titleInput=document.getElementById("inputAppTitle");
    if(titleInput)titleInput.value=appTitle;

    const emailInput=document.getElementById("inputNotificationEmail");
    if(emailInput)emailInput.value=notificationEmail;

    renderStaffOptions();
    renderStaffManagementList();
    renderSiteOptions();
    renderSiteManagementList();
}

/* =====================================
   起動PIN変更
===================================== */

async function updateAppUnlockPin(){
    if(!await requireAdmin())return;

    const currentPin=document.getElementById("inputCurrentAppPin").value.trim();
    const newPin=document.getElementById("inputNewAppPin").value.trim();

    if(!currentPin){
        return alert("現在の起動用ロックナンバーを入力するアル！");
    }

    if(!newPin){
        return alert("新しい起動用ロックナンバーを入力するアル！");
    }

    const enteredHash=await hashPin(currentPin);

    if(enteredHash!==appUnlockPinHash){
        return alert("現在の起動用ロックナンバーが違います！");
    }

    appUnlockPinHash=await hashPin(newPin);

    const saved=await saveSettingsToFirestore();

    if(saved){
        document.getElementById("inputCurrentAppPin").value="";
        document.getElementById("inputNewAppPin").value="";
        alert("起動時ロックナンバーを変更したアル！");
    }
}

/* =====================================
   タイトル変更
===================================== */

async function updateTitle(){
    if(!await requireAdmin())return;

    const newTitle=document.getElementById("inputAppTitle").value.trim();

    if(!newTitle)return alert("タイトルを入力するアル！");

    appTitle=newTitle;

    const saved=await saveSettingsToFirestore();

    if(saved)alert("タイトルを変更したアル！");
}

/* =====================================
   通知メール変更
===================================== */

async function updateEmail(){
    if(!await requireAdmin())return;

    notificationEmail=
        document.getElementById("inputNotificationEmail").value.trim();

    const saved=await saveSettingsToFirestore();

    if(saved)alert("通知先メールアドレスを保存したアル！");
}

/* =====================================
   管理者ログイン
===================================== */

async function openAdminPage(){
    const email=prompt(
        "管理者のメールアドレスを入力してください："
    );

    if(email===null)return;

    const password=prompt(
        "管理者のパスワードを入力してください："
    );

    if(password===null)return;

    try{
        stopRecordsListener();
        await signOut(auth);

        const result=await signInWithEmailAndPassword(
            auth,
            email.trim(),
            password
        );

        await getIdToken(result.user,true);

        if(result.user.uid!==ADMIN_UID){
            await signOut(auth);
            await signInAnonymously(auth);
            startRecordsListener();

            alert(
                "このアカウントは管理者として登録されていません。"
            );
            return;
        }

        console.log("管理者ログインOK:",result.user.uid);

        startRecordsListener();

        document.getElementById("adminPage").style.display="block";

        window.scrollTo({
            top:document.getElementById("adminPage").offsetTop,
            behavior:"smooth"
        });

    }catch(error){
        console.error(
            "管理者ログイン失敗:",
            error.code,
            error.message
        );

        try{
            await signInAnonymously(auth);
            startRecordsListener();
        }catch(anonymousError){
            console.error(
                "匿名再ログイン失敗:",
                anonymousError
            );
        }

        alert(
            "管理者ログインに失敗しました。\n\n"+
            "エラーコード: "+error.code
        );
    }
}

/* =====================================
   管理者画面を閉じる
===================================== */

async function closeAdminPage(){
    document.getElementById("adminPage").style.display="none";

    try{
        stopRecordsListener();
        await signOut(auth);
        await signInAnonymously(auth);
        startRecordsListener();

        console.log("管理者ログアウト → 匿名認証");

    }catch(error){
        console.error("管理者ログアウトエラー:",error);
        alert(
            "管理者ログアウトに失敗しました。\n\n"+
            error.message
        );
    }
}

/* =====================================
   従業員選択肢
===================================== */

function renderStaffOptions(){
    const select=document.getElementById("staffSelect");
    if(!select)return;

    const currentVal=select.value;
    select.innerHTML="";

    // 初期プレースホルダー
    const defaultOption=document.createElement("option");
    defaultOption.value="";
    defaultOption.textContent="ー従業員を選択ー";
    defaultOption.disabled=true;
    defaultOption.selected=true;
    select.appendChild(defaultOption);

    staffMembers.forEach(staff=>{
        const option=document.createElement("option");
        option.value=staff.name;
        option.textContent=staff.name;
        select.appendChild(option);
    });

    if(staffMembers.some(s=>s.name===currentVal)){
        select.value=currentVal;
    }
}

/* =====================================
   従業員管理リスト
===================================== */

function renderStaffManagementList(){
    const list=document.getElementById("staffListDisplay");
    if(!list)return;

    list.innerHTML="";

    staffMembers.forEach((staff,index)=>{
        const li=document.createElement("li");
        li.className="staff-item";

        const info=document.createElement("div");
        info.className="staff-info";

        const name=document.createElement("span");
        name.textContent=staff.name;

        const small=document.createElement("small");
        small.textContent="ロックナンバー: **** (保護されています)";

        info.appendChild(name);
        info.appendChild(small);

        const button=document.createElement("button");
        button.className="btn-delete";
        button.textContent="削除";
        button.onclick=()=>removeStaff(index);

        li.appendChild(info);
        li.appendChild(button);
        list.appendChild(li);
    });
}

/* =====================================
   従業員追加
===================================== */

async function addStaff(){
    if(!await requireAdmin())return;

    const inputName=document.getElementById("newStaffName");
    const inputPin=document.getElementById("newStaffPin");

    const name=inputName.value.trim();
    const pin=inputPin.value.trim();

    if(!name)return alert("従業員名を入力するアル！");
    if(!pin)return alert("従業員のロックナンバーを入力するアル！");

    if(staffMembers.some(s=>s.name===name)){
        return alert("もう登録されている名前アル！");
    }

    staffMembers.push({
        name,
        pinHash:await hashPin(pin)
    });

    const saved=await saveSettingsToFirestore();

    if(saved){
        inputName.value="";
        inputPin.value="";
        alert("新しい従業員を追加したアル！");
    }
}

/* =====================================
   出退勤
===================================== */

async function handleClock(type){
    const staffName=document.getElementById("staffSelect").value;

    if(!staffName)return alert("従業員を選ぶアル！");

    const staffObj=staffMembers.find(s=>s.name===staffName);

    if(!staffObj)return alert("従業員データが見つからないアル！");

    let site="";

    if(type==="in"){
        site=document.getElementById("siteSelect").value;

        if(!site)return alert("現場名を選ぶか入力するアル！");

        if(site==="__OTHER__"){
            site=document.getElementById("customSiteName").value.trim();

            if(!site)return alert("現場名を入力するアル！");
        }
    }

    const enteredPin=prompt(
        `${staffName} さん、ロックナンバーを入力してください：`
    );

    if(enteredPin===null)return;

    const enteredHash=await hashPin(enteredPin);

    if(enteredHash!==staffObj.pinHash){
        return alert(
            "ロックナンバーが違うアル！本人以外は打刻できないヨ！"
        );
    }

    const msgEl=document.getElementById("msg");
    msgEl.innerText="位置情報を取得中アル…";

    if(!navigator.geolocation){
        processClockAction(type,staffName,site,"位置情報非対応");
        return;
    }

    navigator.geolocation.getCurrentPosition(
        position=>{
            const lat=position.coords.latitude;
            const lng=position.coords.longitude;
            const locationStr=
                `${lat.toFixed(5)}, ${lng.toFixed(5)}`;

            processClockAction(
                type,
                staffName,
                site,
                locationStr
            );
        },
        error=>{
            console.warn("位置情報取得エラー:",error.message);

            processClockAction(
                type,
                staffName,
                site,
                "取得失敗(許可拒否等)"
            );
        },
        {
            timeout:10000,
            enableHighAccuracy:true
        }
    );
}

/* =====================================
   打刻処理
===================================== */

async function processClockAction(type,staff,site,locationStr){
    try{
        const now=new Date();

        const month=String(now.getMonth()+1).padStart(2,"0");
        const day=String(now.getDate()).padStart(2,"0");
        const hours=String(now.getHours()).padStart(2,"0");
        const minutes=String(now.getMinutes()).padStart(2,"0");
        const seconds=String(now.getSeconds()).padStart(2,"0");

        const dateTimeStr=
            `${month}/${day} ${hours}:${minutes}:${seconds}`;

        const actionTypeStr=type==="in" ? "出勤" : "退勤";
        let targetSite=site;

        if(type==="in"){
            const workingQuery=query(
                collection(db,"records"),
                where("staff","==",staff),
                where("status","==","勤務中")
            );

            const workingSnapshot=await getDocs(workingQuery);

            if(!workingSnapshot.empty){
                document.getElementById("msg").innerText="";

                return alert(
                    `${staff}さんは、もう出勤してるアル！\n`+
                    "先に退勤打刻してから、もう一度出勤するヨ！"
                );
            }

            await addDoc(
                collection(db,"records"),
                {
                    staff,
                    site,
                    clockIn:dateTimeStr,
                    clockInLoc:locationStr,
                    clockOut:"-",
                    clockOutLoc:"-",
                    status:"勤務中",
                    timestamp:Date.now()
                }
            );

            document.getElementById("msg").innerText=
                `${staff} さん、出勤打刻したアル！ (${dateTimeStr})`;

        }else{
            const workingQuery=query(
                collection(db,"records"),
                where("staff","==",staff),
                where("status","==","勤務中")
            );

            const workingSnapshot=await getDocs(workingQuery);

            const targetDoc=
                workingSnapshot.empty
                    ? null
                    : workingSnapshot.docs[0];

            const target=targetDoc
                ? {id:targetDoc.id,...targetDoc.data()}
                : null;

            if(!target){
                document.getElementById("msg").innerText="";

                return alert(
                    `${staff}さんは、まだ出勤してないアル！\n`+
                    "先に出勤打刻するヨ！"
                );
            }

            targetSite=target.site;

            await updateDoc(
                doc(db,"records",target.id),
                {
                    clockOut:dateTimeStr,
                    clockOutLoc:locationStr,
                    status:"退勤済み"
                }
            );

            document.getElementById("msg").innerText=
                `${staff} さん、退勤打刻したアル！ (${dateTimeStr})`;
        }

        if(notificationEmail){
            sendNotificationEmail(
                notificationEmail,
                {
                    staff,
                    type:actionTypeStr,
                    site:targetSite||"不明",
                    time:dateTimeStr,
                    location:locationStr
                }
            );
        }

    }catch(error){
        console.error("打刻処理エラー:",error);

        alert(
            "打刻処理に失敗しました。\n\n"+
            error.message
        );
    }
}

   メール通知
===================================== */

function sendNotificationEmail(toEmail,data){
    emailjs.send(
        "service_dis5gyi",
        "template_p2ghsr8",
        {
            to_email:toEmail,
            staff_name:data.staff,
            action_type:data.type,

        }
    ).then(
        ()=>{},

    );
}

/* =====================================

===================================== */

function renderTable(){
    const tbody=document.getElementById("attendanceTable");
    if(!tbody)return;

    tbody.innerHTML="";

    const sortedRecords=[...records].sort(
        (a,b)=>(b.timestamp||0)-(a.timestamp||0)
    );

    sortedRecords.forEach(r=>{
        const badgeClass=
            r.status==="勤務中"
                ? "badge-working"
                : "badge-done";

        const tr=document.createElement("tr");

        const tdStaff=document.createElement("td");
        tdStaff.textContent=r.staff||"-";

        const tdSite=document.createElement("td");
        tdSite.textContent=r.site||"-";

        const tdIn=document.createElement("td");
        tdIn.textContent=r.clockIn||"-";

        const tdStatus=document.createElement("td");
        const badge=document.createElement("span");
        badge.className=badgeClass;
        badge.textContent=r.status||"-";
        tdStatus.appendChild(badge);

        const tdInLoc=document.createElement("td");
        tdInLoc.innerHTML=formatLocationCell(r.clockInLoc);

        const tdOut=document.createElement("td");
        tdOut.textContent=r.clockOut||"-";

        const tdOutLoc=document.createElement("td");
        tdOutLoc.innerHTML=formatLocationCell(r.clockOutLoc);

        const tdAction=document.createElement("td");
        const deleteButton=document.createElement("button");
        deleteButton.className="btn-delete";
        deleteButton.textContent="削除";
        deleteButton.onclick=()=>removeRecord(r.id);
        tdAction.appendChild(deleteButton);

        tr.appendChild(tdStaff);
        tr.appendChild(tdSite);
        tr.appendChild(tdIn);
        tr.appendChild(tdStatus);
        tr.appendChild(tdInLoc);
        tr.appendChild(tdOut);
        tr.appendChild(tdOutLoc);
        tr.appendChild(tdAction);

        tbody.appendChild(tr);
    });
}

/* =====================================
   位置情報表示
===================================== */

function formatLocationCell(locStr){
    if(
        !locStr ||
        locStr==="-" ||
        String(locStr).includes("失敗") ||
        String(locStr).includes("非対応")
    ){
        return escapeHtml(locStr||"-");
    }

    const safeLocation=encodeURIComponent(String(locStr));

    return `
        <a
            href="https://maps.google.com/?q=${safeLocation}"
            target="_blank"
            rel="noopener noreferrer"
            class="map-link"
        >📍 現在地を確認する</a>
    `;
}

/* =====================================
   HTMLエスケープ
===================================== */

function escapeHtml(value){
    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

/* =====================================
   打刻1件削除
===================================== */

async function removeRecord(id){
    if(!await requireAdmin())return;

    if(!confirm("この打刻データを削除するアルか？"))return;

    try{
        await deleteDoc(doc(db,"records",id));
    }catch(error){
        console.error("打刻データ削除エラー:",error);

        alert(
            "打刻データの削除に失敗しました。\n\n"+
            error.message
        );
    }
}

/* =====================================
   打刻データ全削除
===================================== */

async function clearAllRecords(){
    if(!await requireAdmin())return;

    if(records.length===0){
        return alert("削除するデータがないアル！");
    }

    if(!confirm(
        "【最終確認】すべての打刻データを一括削除するアルか？\n\n"+
        "この操作は元に戻せないよ！"
    ))return;

    try{
        const deletePromises=records.map(
            r=>deleteDoc(doc(db,"records",r.id))
        );

        await Promise.all(deletePromises);

        alert("すべての打刻データを一括削除したアル！");

    }catch(error){
        console.error("一括削除エラー:",error);

        alert(
            "一括削除に失敗しました。\n\n"+
            error.message
        );
    }
}

/* =====================================
   CSV出力
===================================== */

function exportToCSV(){
    if(records.length===0){
        return alert("出力するデータがないアル！");
    }

    if(!isAdminUser()){
        return alert(
            "CSV出力は管理者ログイン後に利用できます。"
        );
    }

    let csv=
        "名前,現場名,出勤日時,状態,出勤位置,退勤日時,退勤位置\n";

    records.forEach(r=>{
        const row=[
            r.staff||"",
            r.site||"",
            r.clockIn||"",
            r.status||"",
            r.clockInLoc||"-",
            r.clockOut||"",
            r.clockOutLoc||"-"
        ];

        csv+=row.map(
            value=>`"${String(value).replace(/"/g,'""')}"`
        ).join(",")+"\n";
    });

    const blob=new Blob(
        ["\uFEFF"+csv],
        {type:"text/csv;charset=utf-8;"}
    );

    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");

    a.href=url;
    a.download="attendance.csv";

    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);

    URL.revokeObjectURL(url);
}
