<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="app-title-tag">出退勤表(仮)</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --success: #16a34a;
            --danger: #dc2626;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-sub: #64748b;
            --border: #cbd5e1;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 12px;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            -webkit-tap-highlight-color: transparent;
        }
        .card {
            background: var(--card-bg);
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            margin-bottom: 16px;
        }
        h2 {
            margin-top: 0;
            color: var(--primary);
            font-size: 18px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        h3 { font-size: 15px; color: var(--text-sub); margin-bottom: 8px; margin-top: 20px; }
        .form-group { margin-bottom: 14px; }
        label { font-weight: 600; display: block; margin-bottom: 6px; font-size: 13px; color: var(--text-sub); }
        select, input {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            box-sizing: border-box;
            background-color: #fff;
            color: var(--text-main);
        }
        .btn-row { display: flex; gap: 10px; margin-top: 16px; }
        button {
            flex: 1;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: #fff;
        }
        .btn-in { background-color: var(--success); }
        .btn-out { background-color: var(--danger); }
        .btn-primary { background-color: var(--primary); }
        .btn-secondary { background-color: #475569; }
        .btn-danger { background-color: var(--danger); }
        
        .sync-badge {
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 12px;
            background: #dcfce7;
            color: #166534;
            font-weight: normal;
        }
        
        .admin-toggle-btn {
            width: 100%;
            background-color: #334155;
            color: white;
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-size: 15px;
            font-weight: bold;
            margin-top: 10px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            margin-top: 8px;
        }
        th, td {
            border: 1px solid #e2e8f0;
            padding: 8px;
            text-align: left;
        }
        th { background-color: #f1f5f9; }
        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #f1f5f9;
        }
        .location-info {
            font-size: 12px;
            color: var(--text-sub);
            margin-top: 6px;
        }
    </style>
</head>
<body>

    <!-- メイン打刻画面 -->
    <div class="card">
        <h2 id="main-title">
            <span>出退勤表(仮)</span>
            <span class="sync-badge">リアルタイム同期中</span>
        </h2>
        
        <div class="form-group">
            <label>従業員を選択:</label>
            <select id="employee-select">
                <option value="">-- 選択してください --</option>
            </select>
        </div>

        <div class="form-group">
            <label>現場名を選択:</label>
            <select id="site-select">
                <option value="">-- 選択してください --</option>
            </select>
        </div>

        <div class="location-info" id="location-display">現在地: 未取得</div>
        <button type="button" id="get-location-btn" style="margin-top: 6px; padding: 6px 10px; font-size: 12px; background: #64748b; border-radius: 4px;">現在地を確認する</button>

        <div class="btn-row">
            <button type="button" class="btn-in" id="clock-in-btn">出勤</button>
            <button type="button" class="btn-out" id="clock-out-btn">退勤</button>
        </div>
    </div>

    <button type="button" class="admin-toggle-btn" id="open-admin-btn">🔒 管理者画面へ（ロック付）</button>

    <!-- 管理者画面（初期非表示） -->
    <div class="card" id="admin-panel" style="display: none;">
        <h2>
            <span>管理者画面</span>
            <button type="button" class="btn-danger" id="close-admin-btn" style="width: auto; padding: 6px 12px; font-size: 13px;">閉じる</button>
        </h2>

        <h3>基本設定</h3>
        <div class="form-group">
            <label>アプリタイトル</label>
            <input type="text" id="admin-title-input" placeholder="例: KU・DESIGN 出退勤表">
            <button type="button" class="btn-primary" id="save-title-btn" style="margin-top: 8px;">保存</button>
        </div>
        <div class="form-group">
            <label>ロックナンバー変更</label>
            <input type="password" id="admin-pin-input" placeholder="新しいPINコード">
            <button type="button" class="btn-primary" id="save-pin-btn" style="margin-top: 8px;">変更</button>
        </div>

        <h3>打データ一覧・出力</h3>
        <button type="button" class="btn-primary" id="export-csv-btn">CSV出力</button>
        <div style="overflow-x: auto; max-height: 200px; margin-top: 10px;">
            <table id="records-table">
                <thead>
                    <tr>
                        <th>名前</th>
                        <th>現場名</th>
                        <th>日時</th>
                        <th>状態</th>
                        <th>位置</th>
                    </tr>
                </thead>
                <tbody id="records-tbody">
                    <!-- 動的挿入 -->
                </tbody>
            </table>
        </div>

        <h3>従業員名簿の編集</h3>
        <div class="form-group">
            <input type="text" id="new-employee-input" placeholder="新しい従業員名">
            <button type="button" class="btn-primary" id="add-employee-btn" style="margin-top: 8px;">追加</button>
        </div>
        <div id="employee-list-container"></div>

        <h3>現場一覧の編集</h3>
        <div class="form-group">
            <input type="text" id="new-site-input" placeholder="新しい現場名">
            <button type="button" class="btn-primary" id="add-site-btn" style="margin-top: 8px;">追加</button>
        </div>
        <div id="site-list-container"></div>
    </div>

    <!-- Firebase SDK (Modular CDN) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, collection, addDoc, onSnapshot, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Firebase設定（自動反映用）
        const firebaseConfig = {
            projectId: "work-stamp-app"
        };
        
        // もしfirebaseConfigのapiKey等が必要な場合はここに入りますが、テストモード・同一プロジェクト内であればこれでも動作します
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // DOM要素
        const mainTitle = document.getElementById("main-title");
        const appTitleTag = document.getElementById("app-title-tag");
        const adminTitleInput = document.getElementById("admin-title-input");
        const employeeSelect = document.getElementById("employee-select");
        const siteSelect = document.getElementById("site-select");
        const employeeListContainer = document.getElementById("employee-list-container");
        const siteListContainer = document.getElementById("site-list-container");
        const recordsTbody = document.getElementById("records-tbody");
        const locationDisplay = document.getElementById("location-display");
        
        let currentLat = null;
        let currentLng = null;

        // 現在地取得
        document.getElementById("get-location-btn").addEventListener("click", () => {
            if (!navigator.geolocation) {
                alert("お使いのブラウザは位置情報に対応していません");
                return;
            }
            locationDisplay.textContent = "現在地を取得中...";
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    currentLat = pos.coords.latitude;
                    currentLng = pos.coords.longitude;
                    locationDisplay.textContent = `現在地: 取得成功 (${currentLat.toFixed(4)}, ${currentLng.toFixed(4)})`;
                },
                (err) => {
                    locationDisplay.textContent = "現在地の取得に失敗しました";
                    alert("位置情報の取得に失敗しました。権限を確認してください。");
                },
                { enableHighAccuracy: true }
            );
        });

        // 1. 設定データのリアルタイム監視 (タイトル等)
        onSnapshot(doc(db, "settings", "config"), (docSnap) => {
            if (docSnap.exists()) {
                const data = docSnap.data();
                if (data.title) {
                    mainTitle.innerHTML = `<span>${data.title}</span><span class="sync-badge">リアルタイム同期中</span>`;
                    appTitleTag.textContent = data.title;
                    adminTitleInput.value = data.title;
                }
            } else {
                // 初期データ作成
                setDoc(doc(db, "settings", "config"), { title: "出退勤表(仮)", pin: "1234" });
            }
        });

        // タイトル保存
        document.getElementById("save-title-btn").addEventListener("click", async () => {
            const newTitle = adminTitleInput.value.trim();
            if (!newTitle) return;
            try {
                await setDoc(doc(db, "settings", "config"), { title: newTitle }, { merge: true });
                alert("タイトルを保存しました！");
            } catch (e) {
                alert("保存に失敗しました: " + e.message);
            }
        });

        // 2. 従業員名簿のリアルタイム監視
        onSnapshot(collection(db, "employees"), (snapshot) => {
            employeeSelect.innerHTML = '<option value="">-- 選択してください --</option>';
            employeeListContainer.innerHTML = "";
            snapshot.forEach((docSnap) => {
                const emp = docSnap.data();
                const id = docSnap.id;
                
                // セレクトボックスに追加
                const opt = document.createElement("option");
                opt.value = emp.name;
                opt.textContent = emp.name;
                employeeSelect.appendChild(opt);

                // 管理者画面の一覧に追加
                const div = document.createElement("div");
                div.className = "list-item";
                div.innerHTML = `<span>${emp.name}</span> <button type="button" class="btn-danger" style="width:auto; padding:4px 8px; font-size:12px;" data-id="${id}" data-type="employee">削除</button>`;
                employeeListContainer.appendChild(div);
            });
        });

        // 従業員追加
        document.getElementById("add-employee-btn").addEventListener("click", async () => {
            const input = document.getElementById("new-employee-input");
            const name = input.value.trim();
            if (!name) return;
            await addDoc(collection(db, "employees"), { name });
            input.value = "";
        });

        // 3. 現場一覧のリアルタイム監視
        onSnapshot(collection(db, "sites"), (snapshot) => {
            siteSelect.innerHTML = '<option value="">-- 選択してください --</option>';
            siteListContainer.innerHTML = "";
            snapshot.forEach((docSnap) => {
                const site = docSnap.data();
                const id = docSnap.id;

                const opt = document.createElement("option");
                opt.value = site.name;
                opt.textContent = site.name;
                siteSelect.appendChild(opt);

                const div = document.createElement("div");
                div.className = "list-item";
                div.innerHTML = `<span>${site.name}</span> <button type="button" class="btn-danger" style="width:auto; padding:4px 8px; font-size:12px;" data-id="${id}" data-type="site">削除</button>`;
                siteListContainer.appendChild(div);
            });
        });

        // 現場追加
        document.getElementById("add-site-btn").addEventListener("click", async () => {
            const input = document.getElementById("new-site-input");
            const name = input.value.trim();
            if (!name) return;
            await addDoc(collection(db, "sites"), { name });
            input.value = "";
        });

        // リスト削除（従業員・現場共通）
        document.addEventListener("click", async (e) => {
            if (e.target.tagName === "BUTTON" && e.target.dataset.id) {
                const id = e.target.dataset.id;
                const type = e.target.dataset.type;
                if (type === "employee") {
                    await deleteDoc(doc(db, "employees", id));
                } else if (type === "site") {
                    await deleteDoc(doc(db, "sites", id));
                }
            }
        });

        // 4. 打刻データのリアルタイム監視・記録
        onSnapshot(query(collection(db, "records"), orderBy("timestamp", "desc")), (snapshot) => {
            recordsTbody.innerHTML = "";
            snapshot.forEach((docSnap) => {
                const r = docSnap.data();
                const tr = document.createElement("tr");
                const timeStr = r.timestamp ? new Date(r.timestamp.toDate()).toLocaleString() : "";
                tr.innerHTML = `<td>${r.employee}</td><td>${r.site}</td><td>${timeStr}</td><td>${r.type}</td><td>${r.lat ? r.lat.toFixed(2)+','+r.lng.toFixed(2) : '-'}</td>`;
                recordsTbody.appendChild(tr);
            });
        });

        // 出勤・退勤ボタン処理
        const handleClock = async (type) => {
            const employee = employeeSelect.value;
            const site = siteSelect.value;
            if (!employee || !site) {
                alert("従業員と現場名を選択してください！");
                return;
            }
            try {
                await addDoc(collection(db, "records"), {
                    employee,
                    site,
                    type,
                    lat: currentLat,
                    lng: currentLng,
                    timestamp: new Date()
                });
                alert(`${type}を記録しました！`);
            } catch (e) {
                alert("記録に失敗しました: " + e.message);
            }
        };

        document.getElementById("clock-in-btn").addEventListener("click", () => handleClock("出勤"));
        document.getElementById("clock-out-btn").addEventListener("click", () => handleClock("退勤"));

        // 管理者画面の開閉
        const adminPanel = document.getElementById("admin-panel");
        document.getElementById("open-admin-btn").addEventListener("click", () => {
            const pin = prompt("管理者PINコードを入力してください (初期値: 1234):");
            if (pin === "1234") { // 簡易PIN
                adminPanel.style.display = "block";
                window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
            } else if (pin !== null) {
                alert("PINコードが違います");
            }
        });

        document.getElementById("close-admin-btn").addEventListener("click", () => {
            adminPanel.style.display = "none";
        });

        // CSV出力
        document.getElementById("export-csv-btn").addEventListener("click", () => {
            let csv = "名前,現場名,日時,状態,緯度,経度\n";
            // 簡易的にテーブルから出力
            const rows = recordsTbody.querySelectorAll("tr");
            rows.forEach(tr => {
                const cols = tr.querySelectorAll("td");
                if(cols.length > 0) {
                    csv += Array.from(cols).map(c => `"${c.textContent}"`).join(",") + "\n";
                }
            });
            const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "work_records.csv";
            a.click();
        });
    </script>
</body>
</html>
